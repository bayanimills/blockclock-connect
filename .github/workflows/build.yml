name: Build & push image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  selfcheck:
    name: Selfcheck (offline test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps
        run: pip install flask waitress
      - name: Run selfcheck
        run: python app.py --selfcheck

  build:
    name: Build multi-arch image
    needs: selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a v* tag push this yields "<version>" (leading v stripped) + "latest";
      # on workflow_dispatch from a branch it yields just "latest".
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bayanimills/blockclock-connect
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
